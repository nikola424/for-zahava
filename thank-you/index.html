<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You&rsquo;re booked · Zahava Thornton</title>
  <meta name="robots" content="noindex" />
  <script>document.documentElement.className += " js";</script>
  <link rel="icon" href="../assets/img/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png" />
  <link rel="stylesheet" href="../assets/vendor/lenis.css" />
  <link rel="stylesheet" href="../vsl/vsl.css" />
  <link rel="stylesheet" href="../assets/brand.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /><style>:root{--sans:"Inter",Arial,sans-serif}</style>
</head>
<body>
  <main class="page">
    <section class="hero" style="padding-bottom:0">
      <p class="eyebrow hero__eyebrow">You're booked in</p>
      <h1 class="hero__title">Here's how to get the most out of your call</h1>
    </section>

    <div class="container">
      <!-- Step 1 · welcome video (video X: one unique frame) -->
      <section class="ty-step">
        <p class="ty-step__label reveal">Step 1 of 3</p>
        <h2 class="ty-step__title reveal" style="--i:1">Watch the video below</h2>
        
        <figure class="ccard ccard--hero reveal reveal--pop" style="--i:2">
          <span class="ccard__thumb"><img src="../assets/img/thankyou/welcome.jpg" alt="Welcome video from Zahava" /><span class="ccard__play" aria-hidden="true"></span></span>
        </figure>
      </section>

      <!-- Step 2 · breakouts (video Y: frames from one sitting) -->
      <section class="ty-step">
        <p class="ty-step__label reveal">Step 2 of 3</p>
        <h2 class="ty-step__title reveal" style="--i:1">Get your questions answered</h2>
        <div class="grid2">
          <figure class="ccard reveal reveal--pop" style="--i:0">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/q1.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">Is this for brand new reps?</figcaption>
          </figure>
          <figure class="ccard reveal reveal--pop" style="--i:1">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/q2.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">Does it work outside Medicare?</figcaption>
          </figure>
          <figure class="ccard reveal reveal--pop" style="--i:2">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/q3.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">How much time does it take around my shifts?</figcaption>
          </figure>
          <figure class="ccard reveal reveal--pop" style="--i:3">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/q4.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">What if I hate sounding salesy?</figcaption>
          </figure>
        </div>
      </section>

      <!-- Step 3 · due diligence (video Z: frames from one other sitting) -->
      <section class="ty-step">
        <p class="ty-step__label reveal">Step 3 of 3</p>
        <h2 class="ty-step__title reveal" style="--i:1">Overcome your suspicions</h2>
        <div class="grid2">
          <figure class="ccard reveal reveal--pop" style="--i:0">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/s1.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">Is Zahava still selling, or just posting about it?</figcaption>
          </figure>
          <figure class="ccard reveal reveal--pop" style="--i:1">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/s2.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">Who actually reviews my calls?</figcaption>
          </figure>
          <figure class="ccard reveal reveal--pop" style="--i:2">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/s3.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">What if I do the work and nothing changes?</figcaption>
          </figure>
          <figure class="ccard reveal reveal--pop" style="--i:3">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/s4.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">Why not just learn it from the free reels?</figcaption>
          </figure>
        </div>
      </section>

      <p class="ty__signoff reveal">See you on the call.</p>
    </div>
  </main>

  <footer class="brandfoot">
    <div class="brand">
      
      <span class="brand__word">The Closers</span>
    </div>
  </footer>

  <script src="../assets/vendor/lenis.min.js"></script>
  <script src="../vsl/vsl.js"></script>
</body>
</html>
